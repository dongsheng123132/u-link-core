name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write  # required to upload release assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Build all platforms
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-s -w -X github.com/dongsheng123132/remote-agent/internal/version.Version=${VERSION}"
          mkdir -p dist
          for target in \
            "windows amd64 .exe" \
            "linux   amd64 ''" \
            "linux   arm64 ''" \
            "darwin  amd64 ''" \
            "darwin  arm64 ''"; do
            set -- $target
            GOOS=$1 GOARCH=$2 go build -trimpath -ldflags="${LDFLAGS}" \
              -o "dist/agent-$1-$2$3" ./cmd/agent
            GOOS=$1 GOARCH=$2 go build -trimpath -ldflags="${LDFLAGS}" \
              -o "dist/remote-agent-$1-$2$3" ./cmd/cli
            GOOS=$1 GOARCH=$2 go build -trimpath -ldflags="${LDFLAGS}" \
              -o "dist/ulink-$1-$2$3" ./cmd/ulink
          done
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" \
            -o dist/server-linux-amd64 ./cmd/server
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" \
            -o dist/server-linux-arm64 ./cmd/server
          (cd dist && sha256sum * > SHA256SUMS)
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
