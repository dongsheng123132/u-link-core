name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the exact command and the full output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: U-Link version / commit
      placeholder: "v0.3.0 / abc1234"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
    validations:
      required: true
