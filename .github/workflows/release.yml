name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write  # required to upload release assets

jobs:
  release:
    # macOS runner so the menu bar app can be built with cgo; the other
    # targets cross-compile from here with cgo disabled.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Build all platforms
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-s -w -X github.com/dongsheng123132/remote-agent/internal/version.Version=${VERSION}"
          mkdir -p dist
          for target in \
            "windows amd64 .exe" \
            "linux amd64" \
            "linux arm64" \
            "darwin amd64" \
            "darwin arm64"; do
            set -- $target
            EXT="${3:-}"
            CGO_ENABLED=0 GOOS=$1 GOARCH=$2 go build -trimpath -ldflags="${LDFLAGS}" \
              -o "dist/agent-$1-$2${EXT}" ./cmd/agent
            CGO_ENABLED=0 GOOS=$1 GOARCH=$2 go build -trimpath -ldflags="${LDFLAGS}" \
              -o "dist/remote-agent-$1-$2${EXT}" ./cmd/cli
            CGO_ENABLED=0 GOOS=$1 GOARCH=$2 go build -trimpath -ldflags="${LDFLAGS}" \
              -o "dist/ulink-$1-$2${EXT}" ./cmd/ulink
          done
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" \
            -o dist/server-linux-amd64 ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" \
            -o dist/server-linux-arm64 ./cmd/server

          # Desktop app: macOS needs cgo for the StatusItem / menu bar.
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" \
            -o dist/ulink-desktop-darwin-arm64 ./cmd/link
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" \
            -o dist/ulink-desktop-darwin-amd64 ./cmd/link
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags="${LDFLAGS} -H windowsgui" -o dist/ulink-desktop-windows-amd64.exe ./cmd/link
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" \
            -o dist/ulink-desktop-linux-amd64 ./cmd/link

          (cd dist && shasum -a 256 * > SHA256SUMS)
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
